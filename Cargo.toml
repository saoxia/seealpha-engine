[workspace]
resolver = "2"
# Validate pinned Nautilus Rust without mutating the production workspace graph.
exclude = ["engine/pipeline/nautilus"]
members = [
    "engine/pipeline/integrity",
    "engine/pipeline/access/catalog",
    "engine/pipeline/sources/binance",
    "engine/pipeline/sources/market",
    "engine/portfolio",
    "engine/execution",
    "engine/ledger",
    "engine/strategy",
    "engine/connection/binance",
    "engine/connection/binance-wire",
    "engine/connection/binance-options",
    "engine/backtest",
    "engine/runtime",
    "engine/gateway/api",
    "engine/apps/trading_engine",
    "benchmarks/rust",
]
[profile.release]
lto = "thin"
codegen-units = 16
