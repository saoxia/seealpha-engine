[workspace]
resolver = "2"
# Validate pinned Nautilus Rust without mutating the production workspace graph.
exclude = ["engine/pipeline/sources/shared/nautilus"]
members = [
    "engine/pipeline/catalog",
    "engine/pipeline/sources/binance/archive",
    "engine/pipeline/sources/shared/market",
    "engine/portfolio",
    "engine/ledger",
    "engine/database",
    "engine/strategy",
    "engine/connection/binance-options",
    "engine/connection/clickhouse",
    "engine/backtest",
    "engine/runtime",
    "engine/gateway/api",
    "engine/apps/trading_engine",
    "benchmarks/rust",
]
[profile.release]
lto = "thin"
codegen-units = 16
debug = 1
strip = "none"  # Docker splits symbols before packaging
