[workspace]
resolver = "2"
members = [
    "market_data/quality",
    "market_data/converter",
    "market_data/catalog",
    "market_data/sources/binance",
    "market_data/market",
    "market_data/feed",
    "portfolio/core",
    "accounting/ledger",
    "application/research",
    "alpha/strategy",
    "connectivity/venue",
    "backtest/core",
    "application/runtime",
    "interfaces/api/http",
    "apps/trading_engine",
    "benchmarks/rust",
]
# These crates are preserved only for the opt-in legacy Python runtime.
# Do not include them in the native Rust workspace.
exclude = [
    "engine/market_data/repair/rust_converter",
    "engine/market_data/quality/rust",
    "engine/market_data/sources/binance_shared/rust",
]

[profile.release]
lto = "thin"
codegen-units = 16
