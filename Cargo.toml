[workspace]
resolver = "2"
members = [
    "crates/quality",
    "crates/data-converter",
    "crates/binance-source",
    "crates/seealpha-market",
    "crates/seealpha-feed",
    "crates/seealpha-portfolio",
    "crates/seealpha-ledger",
    "crates/seealpha-research",
    "crates/seealpha-strategy",
    "crates/seealpha-venue",
    "crates/seealpha-backtest",
    "crates/seealpha-runtime",
    "crates/seealpha-http",
    "crates/seealpha-engine",
    "crates/seealpha-bench",
]
# These crates are preserved only for the opt-in legacy Python runtime.
# Do not include them in the native Rust workspace.
exclude = [
    "engine/market_data/repair/rust_converter",
    "engine/market_data/quality/rust",
    "engine/market_data/sources/binance_shared/rust",
]

[profile.release]
lto = "thin"
codegen-units = 16
