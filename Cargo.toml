[workspace]
resolver = "2"
# The upstream native source is validated independently before joining the
# existing deployment/workspace graph.
exclude = ["integrations/nautilus_binance_data"]
members = [
    "engine/market_data/quality",
    "engine/market_data/converter",
    "engine/market_data/catalog",
    "engine/market_data/sources/binance",
    "engine/market_data/market",
    "engine/market_data/feed",
    "engine/portfolio/core",
    "engine/accounting/ledger",
    "engine/research",
    "engine/strategy",
    "engine/connectivity/venue",
    "engine/backtest/core",
    "engine/application/runtime",
    "engine/interfaces/api/http",
    "engine/apps/trading_engine",
    "benchmarks/rust",
]
[profile.release]
lto = "thin"
codegen-units = 16
