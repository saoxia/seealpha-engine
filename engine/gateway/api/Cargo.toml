[package]
name = "seealpha-http"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
http-body-util = "0.1"
rust_decimal = "1"
seealpha-backtest = { path = "../../backtest" }
seealpha-catalog = { path = "../../pipeline/catalog" }
seealpha-ledger = { path = "../../ledger" }
seealpha-market = { path = "../../pipeline/sources/binance/market" }
seealpha-runtime = { path = "../../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
