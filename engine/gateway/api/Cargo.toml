[package]
name = "seealpha-http"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
axum = "0.8"
http-body-util = "0.1"
seealpha-catalog = { path = "../../pipeline/catalog" }
seealpha-ledger = { path = "../../ledger" }
seealpha-database = { path = "../../database" }
seealpha-market = { path = "../../pipeline/sources/shared/market" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
