[package]
name = "seealpha-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "seealpha-engine"
path = "src/main.rs"

[dependencies]
seealpha-http = { path = "../../interfaces/api/http" }
seealpha-market = { path = "../../market_data/market" }
seealpha-runtime = { path = "../../application/runtime" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
