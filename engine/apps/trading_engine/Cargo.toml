[package]
name = "seealpha-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "seealpha-engine"
path = "src/main.rs"

[dependencies]
seealpha-http = { path = "../../gateway/api" }
seealpha-market = { path = "../../pipeline/sources/shared/market" }
seealpha-catalog = { path = "../../pipeline/catalog" }
seealpha-database = { path = "../../database" }
seealpha-ledger = { path = "../../ledger" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
