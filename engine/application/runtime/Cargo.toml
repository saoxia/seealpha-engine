[package]
name = "seealpha-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
seealpha-ledger = { path = "../../ledger" }
seealpha-feed = { path = "../../market_data/feed" }
seealpha-catalog = { path = "../../market_data/catalog" }
seealpha-binance-market-data-source = { path = "../../market_data/sources/binance" }
seealpha-market = { path = "../../market_data/market" }
seealpha-portfolio = { path = "../../portfolio/core" }
seealpha-backtest = { path = "../../backtest/core" }
seealpha-strategy = { path = "../../strategy" }
seealpha-venue = { path = "../../connectivity/venue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust_decimal = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
