[package]
autobins = false
name = "seealpha-binance-market-data-source"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "=1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
chrono = "0.4"
sha2 = "0.10"
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "binance-trade-archive-fetch"
path = "src/bin/trade_archive_fetch.rs"

[[bin]]
name = "binance-manifest-inspect"
path = "src/bin/manifest_inspect.rs"
