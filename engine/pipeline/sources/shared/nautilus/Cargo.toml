[package]
name = "seealpha-nautilus-binance-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Standalone native Nautilus client. Excluded from the legacy workspace so
# dependency graph and the production engine remain unchanged until acceptance.
[dependencies]
nautilus-binance = { version = "=0.68.0", default-features = false, features = ["high-precision"] }
nautilus-common = "=0.68.0"
nautilus-live = { version = "=0.68.0", features = ["streaming"] }
nautilus-model = { version = "=0.68.0", features = ["high-precision"] }
nautilus-persistence = "=0.68.0"
nautilus-infrastructure = { version = "=0.68.0", default-features = false, features = ["postgres"] }
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

# Only ZIP CSV interpretation; all Tick schemas and Parquet writes are Nautilus-native.
nautilus-core = "=0.68.0"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
chrono = "0.4"
rust_decimal = "1"
seealpha-execution = { path = "../../../../execution" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"

[profile.release]
debug = 1
strip = "none"  # Docker splits symbols before packaging
