[package]
name = "seealpha-catalog"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
arrow-array = "60"
arrow-schema = "60"
base64 = "0.22"
chrono = "0.4"
fs2 = "0.4"
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
seealpha-database = { path = "../../../database" }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
