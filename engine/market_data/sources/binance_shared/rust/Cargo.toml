[package]
name = "seealpha-binance-market-data-source"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "binance-manifest-inspect"
path = "src/main.rs"

[[bin]]
name = "binance-native-source"
path = "src/native_source.rs"

[[bin]]
name = "binance-native-calculation"
path = "src/native_calculation.rs"

[profile.release]
lto = "thin"
codegen-units = 1
