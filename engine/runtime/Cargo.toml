[package]
name = "seealpha-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
seealpha-ledger = { path = "../ledger" }
seealpha-catalog = { path = "../pipeline/access/catalog" }
seealpha-binance-market-data-source = { path = "../pipeline/sources/binance" }
seealpha-market = { path = "../pipeline/sources/market" }
seealpha-portfolio = { path = "../portfolio" }
seealpha-backtest = { path = "../backtest" }
seealpha-strategy = { path = "../strategy" }
seealpha-venue = { path = "../connection/binance" }
seealpha-execution = { path = "../execution" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust_decimal = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
