[package]
name = "seealpha-nautilus-execution"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Isolated execution crate: does not modify the Engine or Pipeline workspace.
[workspace]
resolver = "2"

[dependencies]
nautilus-binance = { version = "=0.68.0", default-features = false, features = ["high-precision"] }
nautilus-common = "=0.68.0"
nautilus-live = "=0.68.0"
nautilus-model = { version = "=0.68.0", features = ["high-precision"] }
nautilus-trading = "=0.68.0"
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
strip = "none"
