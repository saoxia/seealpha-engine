[project]
name = "seealpha-engine"
version = "0.1.0"
description = "Standalone SeeAlpha quantitative engine. The process is Rust; Python hosts strategy packages."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
cache-dir = ".local/cache/ruff"
line-length = 100
target-version = "py311"
extend-exclude = [
    ".local", ".venv", "data", "logs", "reports", "target",
]
