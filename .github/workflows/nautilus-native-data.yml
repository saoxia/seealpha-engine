name: Nautilus native Binance data integration
on:
  pull_request:
    paths:
      - "engine/pipeline/sources/shared/nautilus/**"
      - "engine/pipeline/sources/binance_account/**"
      - "engine/execution/**"
      - "engine/runtime/**"
      - "engine/gateway/api/**"
      - "engine/pipeline/catalog/**"
      - "engine/pipeline/sources/shared/market/**"
      - "docker/seealpha-postgres-schema.sql"
      - "docker/engine.Dockerfile"
      - "docker/entrypoint-with-postgres.sh"
      - "engine/pipeline/sources/binance_spot/**"
      - "engine/pipeline/sources/binance_futures_um/native.rs"
      - ".github/workflows/nautilus-native-data.yml"
      - "Cargo.toml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  execution-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Compile production Rust workspace after legacy OMS removal
        run: cargo check --workspace --all-targets --locked
      - name: Test Pipeline subscription, retention and precision
        run: |
          cargo test -p seealpha-catalog strict_utc_dates_and_schema --locked
          cargo test -p seealpha-catalog valid_options_contract_is_independent_of_spot_symbols --locked
          cargo test -p seealpha-market option_history_persists_only_bar_data --locked
          cargo test -p seealpha-catalog removes_complete_old_day_without_touching_current_day --locked
          cargo test -p seealpha-catalog on_disk_parquet_roundtrip_supports_upsert_and_product_isolation --locked
          cargo test -p seealpha-market open_bars_update_on_every_tick_even_before_close --locked
          cargo test -p seealpha-market instrument_filters_are_exact_not_inferred_from_candle_values --locked
          cargo test -p seealpha-market earlier_tenant_start_wins_and_disabled_prevents_deletion --locked
          cargo test -p seealpha-market historical_second_bars_ --locked
      - name: Check Pipeline lint
        run: cargo clippy -p seealpha-catalog -p seealpha-market -p seealpha-http --all-targets --locked -- -D warnings
      - name: Run pure Execution and Backtest regressions
        run: cargo test -p seealpha-execution -p seealpha-backtest --locked
      - name: Check Execution/Backtest lint
        run: cargo clippy -p seealpha-execution -p seealpha-backtest --all-targets --locked -- -D warnings

  native-binance-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Native Nautilus Binance integration compile
        run: cargo check --manifest-path engine/pipeline/sources/shared/nautilus/Cargo.toml --all-targets
      - name: Native Nautilus Binance offline tests
        run: cargo test --manifest-path engine/pipeline/sources/shared/nautilus/Cargo.toml
      - name: Native Nautilus Binance clippy
        run: cargo clippy --manifest-path engine/pipeline/sources/shared/nautilus/Cargo.toml --all-targets -- -D warnings
      - name: Native Binance account subscription compile
        run: cargo check --manifest-path engine/pipeline/sources/binance_account/Cargo.toml --all-targets
      - name: Native Binance account subscription offline tests
        run: cargo test --manifest-path engine/pipeline/sources/binance_account/Cargo.toml
      - name: Native Binance account subscription clippy
        run: cargo clippy --manifest-path engine/pipeline/sources/binance_account/Cargo.toml --all-targets -- -D warnings
