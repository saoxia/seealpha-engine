name: Nautilus native order probe

on:
  pull_request:
    paths:
      - 'engine/pipeline/sources/shared/nautilus/**'
      - 'docs/validation/NAUTILUS_NATIVE_ORDER_PROBE.md'
      - '.github/workflows/nautilus-native-order-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-order-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/pipeline/sources/shared/nautilus
      - name: Compile all native standalone targets
        run: cargo check --manifest-path engine/pipeline/sources/shared/nautilus/Cargo.toml --all-targets
      - name: Test native order request contract (offline)
        run: cargo test --manifest-path engine/pipeline/sources/shared/nautilus/Cargo.toml --lib order_probe::
      # No exchange credentials or 'cargo run' are provided in CI.
