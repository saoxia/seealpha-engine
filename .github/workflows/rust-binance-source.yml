name: Rust-native Binance source verification
on:
  pull_request:
    paths:
      - "engine/market_data/sources/binance_shared/rust/**"
      - ".github/workflows/rust-binance-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-binance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust unit/integration tests (locked)
        run: cargo test --locked --release --manifest-path engine/market_data/sources/binance_shared/rust/Cargo.toml
