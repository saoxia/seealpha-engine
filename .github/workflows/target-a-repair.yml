name: Target A one-shot Rust format and lockfile repair

on:
  push:
    branches:
      - feat/target-a-ci-lockfmt-repair-20261121
    paths:
      - '.github/workflows/target-a-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'saoxia/seealpha-engine' && github.ref == 'refs/heads/feat/target-a-ci-lockfmt-repair-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - name: Format complete Rust workspace
        run: cargo fmt --all
      - name: Regenerate Cargo.lock for migrated workspace
        run: cargo generate-lockfile
      - name: Verify manifest consistency
        run: cargo metadata --format-version 1 --no-deps >/dev/null
      - name: Commit only generated source formatting and lockfile to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(rust): rustfmt workspace and synchronize Cargo.lock"
          git push origin HEAD:feat/target-a-ci-lockfmt-repair-20261121
