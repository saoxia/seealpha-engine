name: Legacy Python parity

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'core/**'
      - 'tests/engine/**'
      - 'tests/connectors/**'
      - 'tests/feed/**'
      - 'tests/pipeline/**'
      - 'tests/core/**'
      - 'nautilus_support.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/engine-legacy.Dockerfile'
      - '.github/workflows/legacy-python-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - name: Install pinned legacy Python dependencies
        run: uv sync --locked
      - name: Validate legacy Rust converter
        run: |
          cargo build --locked --release --manifest-path engine/market_data/repair/rust_converter/Cargo.toml
          cargo test --locked --release --manifest-path engine/market_data/repair/rust_converter/Cargo.toml
      - name: Build Rust venue repair validator
        run: cargo build --locked --release -p seealpha-catalog --bin seealpha-repair-verify
      - name: Validate legacy Binance source and quality helpers
        run: |
          cargo test --locked --release --manifest-path engine/market_data/quality/rust/Cargo.toml
          cargo test --locked --release --manifest-path engine/market_data/sources/binance_shared/rust/Cargo.toml
          cargo build --locked --release --manifest-path engine/market_data/sources/binance_shared/rust/Cargo.toml --bin binance-journal-replay
      - name: Run restored Python regression suite
        run: uv run pytest -q tests/engine tests/connectors tests/feed tests/pipeline tests/core

  legacy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build opt-in legacy Python Engine
        run: docker build -f docker/engine-legacy.Dockerfile -t seealpha-engine:legacy-ci .
      - name: Verify it does not include Platform sources
        run: docker run --rm --entrypoint sh seealpha-engine:legacy-ci -c 'test ! -e /app/api && test ! -e /app/web && test ! -e /app/migrations && test -e /app/engine/__main__.py'
      - name: Isolated HTTP contract smoke (no exchange credentials)
        run: |
          set -euo pipefail
          docker run -d --name seealpha-engine-legacy-ci -p 127.0.0.1:18767:8766 \
            -e ENGINE_HOST=0.0.0.0 -e ENGINE_AUTH_MODE=token \
            -e ENGINE_TOKEN=ci-legacy-token-0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ENGINE_TENANT_ID=42 -e ENGINE_TENANT_PURPOSE=development \
            seealpha-engine:legacy-ci
          trap 'docker logs seealpha-engine-legacy-ci || true; docker rm -f seealpha-engine-legacy-ci || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS --max-time 2 \
              -H 'Authorization: Bearer ci-legacy-token-0123456789abcdef0123456789abcdef0123456789abcdef' \
              http://127.0.0.1:18767/health >/tmp/legacy-health.json; then
              break
            fi
            sleep 1
          done
          python3 -c 'import json; d=json.load(open("/tmp/legacy-health.json")); assert d["contract_version"] == "2"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18767/health)" = 401
