[package]
name = "seealpha-bench"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "seealpha-bench"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = "1"
seealpha-backtest = { path = "../../engine/backtest" }
seealpha-market = { path = "../../engine/market_data/market" }
seealpha-quality = { path = "../../engine/market_data/quality" }
serde_json = "1"
