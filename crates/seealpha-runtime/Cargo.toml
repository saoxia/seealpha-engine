[package]
name = "seealpha-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
seealpha-ledger = { path = "../seealpha-ledger" }
seealpha-catalog = { path = "../seealpha-catalog" }
seealpha-binance-market-data-source = { path = "../binance-source" }
seealpha-market = { path = "../seealpha-market" }
seealpha-portfolio = { path = "../seealpha-portfolio" }
seealpha-backtest = { path = "../seealpha-backtest" }
seealpha-strategy = { path = "../seealpha-strategy" }
seealpha-venue = { path = "../seealpha-venue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust_decimal = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
